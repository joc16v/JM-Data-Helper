name: Build and package Windows helper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Parser and service checks
        run: dotnet run --project tests/Helper.Tests -c Release
      - name: Publish both packages
        shell: pwsh
        run: ./publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JMDataHelper-v0.2.1-win-x64
          path: artifacts/*.zip
